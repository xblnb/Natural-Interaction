plugins {
    id 'java-library'
    id 'net.neoforged.gradle.userdev' version '7.0.145'
}

version = '1.0.0'
group = 'com.natural_interaction'

base {
    archivesName = 'natural_interaction'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)
jarJar.enable()

configurations {
    libraries
    implementation.extendsFrom libraries
}

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main

        jvmArguments.addAll(
                '--add-opens', 'java.base/java.lang=ALL-UNNAMED',
                '--add-exports', 'java.base/sun.security.util=ALL-UNNAMED',
                '--add-exports', 'java.base/sun.security.x509=ALL-UNNAMED',
                '--add-opens', 'java.base/java.util=ALL-UNNAMED',
                '--add-opens', 'java.desktop/java.awt=ALL-UNNAMED'
        )

        dependencies {
            runtime project.configurations.libraries
            runtime 'org.openpnp:opencv:4.9.0-0'
            runtime 'com.h2database:h2:2.2.224'
        }
    }

    client {
        if (project.hasProperty('quickPlayWorld')) {
            programArgument '--quickPlaySingleplayer'
            programArgument project.property('quickPlayWorld').toString()
        }
    }
    server { programArgument '--nogui' }
    data {
        programArguments.addAll '--mod', 'financialmarket', '--all',
                '--output', file('src/generated/resources/').absolutePath,
                '--existing', file('src/main/resources/').absolutePath
    }
}

jarJar {
}

repositories {
    mavenCentral()
    maven {
        url "https://www.cursemaven.com"
    }
    flatDir {
        dirs 'libs'
    }
}

configurations.all {
    resolutionStrategy {
        force 'org.ow2.asm:asm:9.7'
        force 'org.ow2.asm:asm-analysis:9.7'
        force 'org.ow2.asm:asm-commons:9.7'
        force 'org.ow2.asm:asm-tree:9.7'
        force 'org.ow2.asm:asm-util:9.7'
    }
}

dependencies {
    implementation('net.neoforged:neoforge:21.1.119') {
        exclude group: 'org.ow2.asm', module: 'asm-analysis'
        exclude group: 'org.ow2.asm', module: 'asm-tree'
        exclude group: 'org.ow2.asm', module: 'asm'
        exclude group: 'org.ow2.asm', module: 'asm-commons'
        exclude group: 'org.ow2.asm', module: 'asm-util'
    }

    implementation 'org.ow2.asm:asm:9.7'
    implementation 'org.ow2.asm:asm-tree:9.7'
    implementation 'org.ow2.asm:asm-analysis:9.7'
    implementation 'org.ow2.asm:asm-commons:9.7'
    implementation 'org.ow2.asm:asm-util:9.7'

    libraries 'de.darkblue:LEA-b1.0:1.0'
    libraries 'com.thoughtworks.xstream:xstream:1.4.17'
    libraries 'io.github.x-stream:mxparser:1.2.1'
    libraries 'xmlpull:xmlpull:1.1.3.1'

    libraries 'ai.djl:api:0.28.0'
    libraries 'ai.djl.onnxruntime:onnxruntime-engine:0.28.0'
    libraries 'com.microsoft.onnxruntime:onnxruntime:1.17.1'
    libraries 'com.google.code.gson:gson:2.10.1'
    libraries 'net.java.dev.jna:jna:5.14.0'
    libraries 'org.apache.commons:commons-compress:1.26.1'
    libraries 'commons-codec:commons-codec:1.16.1'
    libraries 'commons-io:commons-io:2.15.1'
    libraries 'org.slf4j:slf4j-api:1.7.36'

    libraries 'com.github.sarxos:webcam-capture:0.3.12'
    libraries 'com.nativelibs4java:bridj:0.7.0'

    compileOnly 'org.openpnp:opencv:4.9.0-0'
}

configurations.named('jarJar') {
    extendsFrom configurations.libraries
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes['Specification-Title'] = 'Financial Market'
        attributes['Specification-Version'] = project.version
        attributes['Implementation-Title'] = project.name
        attributes['Implementation-Version'] = project.version
    }
}
